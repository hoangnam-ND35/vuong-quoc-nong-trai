<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vương Quốc Nông Trại - Game nông trại chơi miễn phí trên web</title>
    <meta name="description" content="Chơi Vương Quốc Nông Trại miễn phí trên trình duyệt. Máy tính và điện thoại đều vào được. Trồng cà rốt, lúa mì, hoa Moonflower, vào cửa hàng Mira và hang thạch anh.">
    <meta name="theme-color" content="#2b6b38">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/hoangnam-ND35/vuong-quoc-nong-trai@main/Build/WebGL.wasm.unityweb" as="fetch" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/hoangnam-ND35/vuong-quoc-nong-trai@main/Build/WebGL.data.unityweb" as="fetch" crossorigin>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a0e06;
        font-family: "Segoe UI", Tahoma, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #seo {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      #unity-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #1a0e06; outline: none; }
      #unity-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        background: linear-gradient(#2a1608, #1a0e06); color: #f4ebd9; z-index: 5; padding: 24px;
      }
      #unity-loading h1 { margin: 0 0 8px; font-size: clamp(22px, 6vw, 34px); }
      #unity-loading p { margin: 0 0 18px; opacity: 0.88; max-width: 520px; line-height: 1.45; }
      #unity-progress { width: min(420px, 70vw); height: 12px; background: #3a2414; border-radius: 999px; overflow: hidden; }
      #unity-progress > div { height: 100%; width: 0%; background: linear-gradient(90deg, #2b6b38, #e5a93c); }
      #unity-pct { margin: 10px 0 0; font-size: 18px; font-weight: 700; }
      #unity-status { margin: 8px 0 0; opacity: 0.75; font-size: 14px; }
      #fullscreen-btn {
        position: fixed; right: 12px; bottom: 12px; z-index: 8; border: 0; cursor: pointer;
        padding: 12px 16px; border-radius: 10px; background: #2b6b38; color: #fff; font-weight: 700;
        box-shadow: 0 4px 0 #0d5222;
      }
    </style>
  </head>
  <body>
    <main id="seo">
      <h1>Vương Quốc Nông Trại</h1>
      <p>Game nông trại fantasy chơi miễn phí trên web.</p>
    </main>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="unity-loading">
      <h1>Vương Quốc Nông Trại</h1>
      <p>Game nông trại chơi ngay trên trình duyệt. Điện thoại vuốt cần lái bên trái, bấm Dùng bên phải.</p>
      <div id="unity-progress"><div></div></div>
      <div id="unity-pct">0%</div>
      <p id="unity-status">Đang tải (~20MB lần đầu, lần sau giữ trong máy)…</p>
    </div>
    <button id="fullscreen-btn" type="button">Toàn màn hình</button>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var bar = document.querySelector("#unity-progress > div");
      var pct = document.querySelector("#unity-pct");
      var status = document.querySelector("#unity-status");
      var fullBtn = document.querySelector("#fullscreen-btn");
      var cdn = "https://cdn.jsdelivr.net/gh/hoangnam-ND35/vuong-quoc-nong-trai@main/Build/";

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }

      function fitCanvas() {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);
      fitCanvas();

      function config(base) {
        return {
          arguments: [],
          dataUrl: base + "WebGL.data.unityweb",
          frameworkUrl: base + "WebGL.framework.js.unityweb",
          codeUrl: base + "WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Vuong Quoc Nong Trai",
          productVersion: "1.0",
          matchWebGLToCanvasSize: true,
          devicePixelRatio: 1
        };
      }

      function onProgress(progress) {
        var n = Math.round(progress * 100);
        bar.style.width = n + "%";
        if (pct) pct.textContent = n + "%";
        if (status) {
          status.textContent = progress < 0.9
            ? "Đang tải file game từ mạng nhanh…"
            : "Đang khởi chạy WebGL…";
        }
      }

      function start(base) {
        return createUnityInstance(canvas, config(base), onProgress);
      }

      start(cdn).catch(function () {
        if (status) status.textContent = "CDN chậm, đang tải từ GitHub…";
        return start("Build/");
      }).then(function (unityInstance) {
        loading.style.display = "none";
        canvas.focus();
        fullBtn.onclick = function () { unityInstance.SetFullscreen(1); };
        window.addEventListener("keydown", function (e) {
          if (e.key === "F11") { e.preventDefault(); unityInstance.SetFullscreen(1); }
        });
      }).catch(function (message) {
        var raw = String(message || "");
        var short = /OOM|memory|abort/i.test(raw)
          ? "Trình duyệt hết bộ nhớ khi tải game. Hãy đóng tab khác rồi tải lại trang."
          : (raw.split("\n")[0] || "Không khởi động được WebGL.");
        if (short.length > 180) short = short.slice(0, 180) + "…";
        loading.innerHTML = "<h1>Không tải được game</h1><p>" + short + "</p><p>Dùng Chrome hoặc Edge, rồi thử lại.</p>";
      });
    </script>
  </body>
</html>
